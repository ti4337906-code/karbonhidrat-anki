                <div class="text-xs font-bold text-indigo-600 dark:text-indigo-400">ÖLÇME &amp; DEĞERLENDİRME KARNESİ (${isOpen ? 'Kısa Cevaplı' : '5 Şıklı'})</div>
                <h2 class="text-2xl font-extrabold mt-0.5">${Number(scorePts.toFixed(1))} / ${qs.length} Puan (%${pct})</h2>
                <p class="text-xs font-bold text-slate-500 mt-1">${level} • Süre: ${state.examElapsedSec} sn</p>
              </div>
              <div class="flex gap-2">
                <button data-action="set-tab" data-tab="stats" class="px-3.5 py-2 rounded-xl bg-indigo-50 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 text-xs font-bold">📈 Eğrileri Gör</button>
                <button data-action="reset-exam" class="px-3.5 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold">Yeni Sınav</button>
              </div>
            </div>

            ${isOpen ? `
              <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-center text-xs">
                <div class="p-3 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800">
                  <div class="mono text-lg font-extrabold text-emerald-600 dark:text-emerald-400">${tiers.exact}</div>
                  <div class="text-[11px] font-bold">✅ Tam Doğru</div>
                </div>
                <div class="p-3 rounded-xl bg-indigo-50 dark:bg-indigo-950/40 border border-indigo-200 dark:border-indigo-800">
                  <div class="mono text-lg font-extrabold text-indigo-600 dark:text-indigo-400">${tiers.tip}</div>
                  <div class="text-[11px] font-bold">🤏 Dilimin Ucundaydı</div>
                </div>
                <div class="p-3 rounded-xl bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800">
                  <div class="mono text-lg font-extrabold text-amber-600 dark:text-amber-400">${tiers.recognized}</div>
                  <div class="text-[11px] font-bold">👀 Görünce Tanıdım</div>
                </div>
                <div class="p-3 rounded-xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800">
                  <div class="mono text-lg font-extrabold text-rose-600 dark:text-rose-400">${tiers.none}</div>
                  <div class="text-[11px] font-bold">❌ Hiç Bilmiyorum</div>
                </div>
              </div>
            ` : ''}

            <div class="space-y-2">
              <div class="text-xs font-extrabold uppercase tracking-wider text-slate-400">Konu Bazlı Performans &amp; Hızlı Kurtarma</div>
              ${Object.entries(byTopic).map(([tid, st]) => {
                const tp = Math.round((st.pts / st.total) * 100);
                return `
                  <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/70 flex flex-wrap items-center justify-between gap-2 text-xs">
                    <span class="font-bold">${getTopicName(tid)}</span>
                    <div class="flex items-center gap-2">
                      <span class="mono font-extrabold ${tp >= 80 ? 'text-emerald-600' : 'text-rose-600'}">%${tp}</span>
                      ${tp < 100 ? `<button data-action="jump-topic-anki" data-topic="${tid}" class="px-2.5 py-1 rounded-lg bg-rose-600 text-white text-[11px] font-bold">Anki’de Çalış →</button>` : ''}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>

            <div class="space-y-2.5 pt-2">
              <div class="text-xs font-extrabold uppercase tracking-wider text-slate-400">Detaylı Çözüm Anahtarı</div>
              ${qs.map((q, idx) => {
                if (isOpen) {
                  const rec = state.examAnswers[q.id] || { text: '', status: 'none' };
                  const ok = rec.status === 'exact';
                  const tagTxt = rec.status === 'exact' ? '✅ Tam Doğru' : rec.status === 'tip' ? '🤏 Dilimin Ucundaydı' : rec.status === 'recognized' ? '👀 Görünce Tanıdım' : '❌ Hiç Bilmiyorum';
                  return `
                    <div class="p-3.5 rounded-2xl border text-xs ${ok ? 'bg-emerald-50/50 dark:bg-emerald-950/20 border-emerald-200 dark:border-emerald-900' : 'bg-rose-50/50 dark:bg-rose-950/25 border-rose-200 dark:border-rose-900'}">
                      <div class="flex items-center justify-between gap-2 font-bold mb-1">
                        <span>${idx + 1}. ${q.q}</span>
                        <span class="shrink-0">${tagTxt}</span>
                      </div>
                      <div class="text-slate-600 dark:text-slate-300"><strong>Senin Cevabın:</strong> ${rec.text || '—'} &nbsp;|&nbsp; <strong>Doğru:</strong> ${q.display}</div>
                      <div class="text-slate-600 dark:text-slate-300 mt-1">${q.exp}</div>
                    </div>
                  `;
                }
                const ok = state.examAnswers[q.id] === q.ans;
                return `
                  <div class="p-3.5 rounded-2xl border text-xs ${ok ? 'bg-emerald-50/50 dark:bg-emerald-950/20 border-emerald-200 dark:border-emerald-900' : 'bg-rose-50/60 dark:bg-rose-950/25 border-rose-200 dark:border-rose-900'}">
                    <div class="font-bold mb-1">${ok ? '✅' : '❌'} ${idx + 1}. ${q.q}</div>
                    <div class="text-slate-600 dark:text-slate-300"><strong>Doğru Cevap:</strong> ${['A','B','C','D','E'][q.ans]}) ${q.opts[q.ans]}</div>
                    <div class="text-slate-600 dark:text-slate-300 mt-1">${q.exp}</div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // AKTİF SINAV EKRANI
    const q = state.examQuestions[state.examIndex];
    const isLast = state.examIndex === state.examQuestions.length - 1;

    // A) KISA CEVAPLI (AÇIK UÇLU) AKTİF GERİ ÇAĞIRMA
    if (isOpen) {
      const rec = state.examAnswers[q.id] || { text: '', status: null, revealed: false };
      return `
        <div class="max-w-3xl mx-auto space-y-4 fade-in">
          <div class="p-3.5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 flex items-center justify-between text-xs">
            <span class="font-extrabold text-indigo-600 dark:text-indigo-400">✍️ Açık Uçlu Soru ${state.examIndex + 1} / ${state.examQuestions.length} • ${getTopicName(q.topic)}</span>
            <span class="mono font-bold text-slate-500">Tamamlanan: ${Object.values(state.examAnswers).filter(x => x && x.status).length}/${state.examQuestions.length}</span>
          </div>

          <div class="p-6 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
            <p class="text-base sm:text-lg font-extrabold leading-relaxed">${q.q}</p>

            ${!rec.revealed ? `
              <div class="space-y-3">
                <input id="open-answer-input" type="text" value="${(rec.text || '').replace(/"/g, '&quot;')}" placeholder="Tek cevap yaz ve Enter’a bas (ör. Enolaz, PFK-1, G6PD)…"
                  class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border-2 border-indigo-200 dark:border-indigo-800 focus:border-indigo-500 outline-none text-sm font-bold" />
                <div class="flex flex-wrap items-center justify-between gap-2">
                  <button data-action="open-skip-reveal" class="px-3.5 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-bold">
                    Hatırlayamadım, Cevabı Göster
                  </button>
                  <button data-action="open-check" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-extrabold shadow-sm">
                    ✓ Cevabımı Kontrol Et (Enter)
                  </button>
                </div>
              </div>
            ` : rec.status === 'exact' ? `
              <div class="p-4 rounded-2xl bg-emerald-50 dark:bg-emerald-950/50 border border-emerald-300 dark:border-emerald-700 space-y-1.5 fade-in">
                <div class="text-sm font-extrabold text-emerald-700 dark:text-emerald-300">✅ Tam Doğru! Direkt "Biliyorum" olarak kaydedildi!</div>
                <div class="text-xs font-bold text-slate-700 dark:text-slate-200">Doğru Cevap: <span class="text-emerald-700 dark:text-emerald-300">${q.display}</span></div>
                <p class="text-xs text-slate-600 dark:text-slate-300">${q.exp}</p>
              </div>
              <div class="flex justify-end">
                ${!isLast
                  ? `<button data-action="exam-next" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-extrabold">Sonraki Soru ▶</button>`
                  : `<button data-action="finish-exam" class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold">✓ Sınavı Bitir &amp; Karneyi Gör</button>`}
              </div>
            ` : `
              <div class="p-4 rounded-2xl bg-amber-50 dark:bg-amber-950/40 border border-amber-300 dark:border-amber-800 space-y-1.5 fade-in">
                <div class="text-xs font-extrabold text-amber-800 dark:text-amber-300">Doğru Cevap: <span class="text-base text-slate-900 dark:text-white ml-1">${q.display}</span></div>
                ${rec.text ? `<div class="text-xs text-slate-500">Senin yazdığın: <em>${rec.text}</em></div>` : ''}
                <p class="text-xs text-slate-700 dark:text-slate-200 pt-1">${q.exp}</p>
              </div>

              <!-- 3 Aşamalı Öz-Değerlendirme (Metacognitive Rating) -->
              <div class="space-y-2 pt-1">
                <div class="text-xs font-extrabold text-slate-500 dark:text-slate-400">Hafıza durumunu dürüstçe seç (SM-2 unutma eğrin buna göre güncellenir):</div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                  <button data-action="open-self-rate" data-status="none" class="p-3 rounded-xl border text-left transition ${
                    rec.status === 'none' ? 'bg-rose-600 text-white border-rose-600' : 'bg-rose-50 dark:bg-rose-950/40 border-rose-200 dark:border-rose-800 hover:border-rose-500'
                  }">
                    <div class="text-xs font-extrabold">❌ Hiç Bilmiyorum</div>
                    <div class="text-[10px] opacity-85 mt-0.5">0 puan • Acil Anki tekrarına atar</div>
                  </button>
                  <button data-action="open-self-rate" data-status="recognized" class="p-3 rounded-xl border text-left transition ${
                    rec.status === 'recognized' ? 'bg-amber-600 text-white border-amber-600' : 'bg-amber-50 dark:bg-amber-950/40 border-amber-200 dark:border-amber-800 hover:border-amber-500'
                  }">
                    <div class="text-xs font-extrabold">👀 Görünce Tanıdım</div>
                    <div class="text-[10px] opacity-85 mt-0.5">Tanıma var, geri çağırma zayıf (Zor)</div>
                  </button>
                  <button data-action="open-self-rate" data-status="tip" class="p-3 rounded-xl border text-left transition ${
                    rec.status === 'tip' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-indigo-50 dark:bg-indigo-950/40 border-indigo-200 dark:border-indigo-800 hover:border-indigo-500'
                  }">
                    <div class="text-xs font-extrabold">🤏 Dilimin Ucundaydı</div>
                    <div class="text-[10px] opacity-85 mt-0.5">Yazım farkı / neredeyse doğru</div>
                  </button>
                </div>
              </div>
            `}
          </div>
        </div>
      `;
    }

    // B) 5 ŞIKLI ÇOKTAN SEÇMELİ (A–E)
    const chosen = state.examAnswers[q.id];
    const answeredCount = Object.keys(state.examAnswers).length;
    return `
      <div class="max-w-3xl mx-auto space-y-4 fade-in">
        <div class="p-3.5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 flex items-center justify-between text-xs">
          <span class="font-extrabold text-indigo-600 dark:text-indigo-400">5 Şıklı Soru ${state.examIndex + 1} / ${state.examQuestions.length} • ${getTopicName(q.topic)}</span>
          <span class="mono font-bold text-slate-500">İşaretlenen: ${answeredCount}/${state.examQuestions.length}</span>
        </div>

        <div class="p-6 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
          <p class="text-sm sm:text-base font-extrabold leading-relaxed">${q.q}</p>
          <div class="space-y-2.5">
            ${q.opts.map((opt, idx) => {
              const sel = chosen === idx;
              return `
                <button data-action="exam-pick" data-qid="${q.id}" data-idx="${idx}"
                  class="w-full text-left p-3.5 rounded-xl border text-xs sm:text-sm font-semibold transition flex items-center gap-3 ${
                    sel ? 'bg-indigo-600 border-indigo-600 text-white shadow-sm' : 'bg-slate-50 dark:bg-slate-800/70 border-slate-200 dark:border-slate-700 hover:border-indigo-400'
                  }">
                  <span class="w-6 h-6 rounded-lg flex items-center justify-center mono text-xs font-extrabold shrink-0 ${sel ? 'bg-white/20 text-white' : 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700'}">${['A','B','C','D','E'][idx]}</span>
                  <span>${opt}</span>
                </button>
              `;
            }).join('')}
          </div>

          <div class="flex items-center justify-between pt-3 border-t border-slate-100 dark:border-slate-800">
            <button data-action="exam-prev" class="px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-bold" ${state.examIndex === 0 ? 'disabled' : ''}>◀ Önceki</button>
            ${!isLast ? `
              <button data-action="exam-next" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold">Sonraki ▶</button>
            ` : `
              <button data-action="finish-exam" class="px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold shadow-sm">✓ Sınavı Bitir &amp; Karneyi Gör</button>
            `}
          </div>
        </div>
      </div>
    `;
  }

  function renderStats() {
    const m = computeMetrics();
    const weakest = [...m.topicStats].sort((a, b) => a.pct - b.pct).slice(0, 2);

    return `
      <div class="space-y-4 fade-in">
        <!-- KPI Kartları -->
        <div class="grid grid-cols-2 lg:grid-cols-5 gap-3">
          <div class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm">
            <div class="text-[11px] font-bold text-slate-400">Ustalaşılan Kart</div>
            <div class="mono text-2xl font-extrabold text-emerald-600 dark:text-emerald-400 mt-0.5">${m.mastered}/${m.total}</div>
            <div class="text-[10px] text-slate-500 mt-0.5">Çalışılan: ${m.studied} kart</div>
          </div>
          <div class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm">
            <div class="text-[11px] font-bold text-slate-400">7 Gün Sonra Kalıcılık</div>
            <div class="mono text-2xl font-extrabold text-indigo-600 dark:text-indigo-400 mt-0.5">%${m.retention7d}</div>
            <div class="text-[10px] text-slate-500 mt-0.5">Stabilite S = ${m.avgStability} gün</div>
          </div>
          <div class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm">
            <div class="text-[11px] font-bold text-slate-400">Anki Hatırlama Oranı</div>
            <div class="mono text-2xl font-extrabold text-teal-600 dark:text-teal-400 mt-0.5">%${m.accuracy}</div>
            <div class="text-[10px] text-slate-500 mt-0.5">${state.totalReviews} toplam tekrar</div>
          </div>
          <div class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm">
            <div class="text-[11px] font-bold text-slate-400">Sınav Ortalaması</div>
            <div class="mono text-2xl font-extrabold text-amber-600 dark:text-amber-400 mt-0.5">${m.examAvg !== null ? `%${m.examAvg}` : '—'}</div>
            <div class="text-[10px] text-slate-500 mt-0.5">${state.examHistory.length} tamamlanan sınav</div>
          </div>
          <div class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm col-span-2 lg:col-span-1">
            <div class="text-[11px] font-bold text-slate-400">Zayıf / Vadesi Gelen</div>
            <div class="mono text-2xl font-extrabold text-rose-600 dark:text-rose-400 mt-0.5">${m.weak} / ${m.dueNow}</div>
            <div class="text-[10px] text-slate-500 mt-0.5">Acil tekrar adayı</div>
          </div>
        </div>

        <!-- Acil Tekrar Önerisi Bandı -->
        <div class="p-4 rounded-2xl bg-amber-50/80 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-800 flex flex-wrap items-center justify-between gap-3">
          <div class="text-xs">
            <span class="font-extrabold text-amber-900 dark:text-amber-200">🎯 Kişiselleştirilmiş Seviye Analizi:</span>
            <span class="text-slate-700 dark:text-slate-300 ml-1">Şu an en düşük hakimiyetin <strong>${weakest[0].name} (%${weakest[0].pct})</strong> ve <strong>${weakest[1].name} (%${weakest[1].pct})</strong> konularında.</span>
          </div>
          <button data-action="jump-topic-anki" data-topic="${weakest[0].id}" class="px-3.5 py-1.5 rounded-xl bg-amber-600 hover:bg-amber-700 text-white text-xs font-extrabold">
            ${weakest[0].short} Kartlarını Başlat →
          </button>
        </div>

        <!-- 3 İstatistiksel Grafik -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
          <div class="p-4 sm:p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm">
            <h3 class="text-sm font-extrabold">📉 Ebbinghaus Unutma Eğrisi: R(t) = e<sup>−t/S</sup></h3>
            <p class="text-[11px] text-slate-500 mb-3">Tekrarsız ham unutma (kırmızı kesikli) ile senin SM-2 tekrarlarınla güçlenen hafıza eğrin (yeşil).</p>
            <div class="relative h-64"><canvas id="chart-forgetting"></canvas></div>
          </div>

          <div class="p-4 sm:p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm">
            <h3 class="text-sm font-extrabold">📈 Gelişim &amp; Doğruluk Eğrisi</h3>
            <p class="text-[11px] text-slate-500 mb-3">Tekrar turların ilerledikçe hatırlama doğruluğun (%) ve ustalaştığın kart sayısının yükselişi.</p>
            <div class="relative h-64"><canvas id="chart-growth"></canvas></div>
          </div>

          <div class="lg:col-span-2 p-4 sm:p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm">
            <h3 class="text-sm font-extrabold">🧭 10 Ana Başlıkta Konu Hakimiyet Haritası (%)</h3>
            <p class="text-[11px] text-slate-500 mb-3">PDF’deki her metabolik yolakta kaç kartı kalıcı hafızaya attığını gösterir.</p>
            <div class="relative h-64"><canvas id="chart-topics"></canvas></div>
          </div>
        </div>
      </div>
    `;
  }

  function renderSyncModal() {
    const root = document.getElementById('sync-modal-root');
    if (!root) return;
    if (!state.syncModalOpen) { root.innerHTML = ''; return; }

    const memLink = generateMemoryLink();
    const memCode = generateMemoryCode();

    root.innerHTML = `
      <div data-action="close-sync" class="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-3 sm:p-5 fade-in">
        <div data-stop-prop="true" class="w-full max-w-xl rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-2xl p-5 sm:p-6 space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-base font-extrabold">🔗 Kişisel Hafıza Linki &amp; Kaldığın Yerden Devam</h3>
            <button data-action="close-sync" class="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-xs font-bold">✕ Kapat</button>
          </div>
          <p class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">
            Tüm SM-2 kart ilerlemen, unutma eğrin ve sınav karnen bu linkin içine şifresiz/sunucusuz olarak gömülür. Bu linki kaydet; yarın veya başka cihazda aşağıya yapıştırdığında <strong>birebir kaldığın yerden</strong> devam edersin!
          </p>

          <div class="space-y-1.5">
            <label class="text-[11px] font-extrabold text-indigo-600 dark:text-indigo-400">Senin Güncel Kişisel Hafıza Linkin:</label>
            <div class="flex gap-2">
              <input id="mem-link-out" readonly value="${memLink}" class="flex-1 px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 mono text-[11px]" />
              <button data-action="copy-mem-link" class="px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shrink-0">📋 Kopyala</button>
            </div>
            <div class="flex items-center justify-between text-[10px] text-slate-400 pt-0.5">
              <span>Kısa Hafıza Kodu uzunluğu: ${memCode.length} karakter</span>
              <button data-action="copy-mem-code" class="text-indigo-600 dark:text-indigo-400 font-bold hover:underline">Sadece Kodu Kopyala</button>
            </div>
          </div>

          <div class="pt-3 border-t border-slate-100 dark:border-slate-800 space-y-2">
            <label class="text-[11px] font-extrabold text-emerald-700 dark:text-emerald-400">Kaldığın Yerden Devam Et (Hafıza Linkini veya Kodunu Yapıştır):</label>
            <textarea id="mem-link-in" rows="2" placeholder="https://...#mem=KHMEM-... veya KHMEM-..." class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 mono text-[11px]"></textarea>
            <div class="flex flex-wrap items-center justify-between gap-2">
              <button data-action="export-tsv" class="px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-xs font-bold">⬇ Gerçek Anki (.tsv) İndir</button>
              <button data-action="import-mem-link" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold">✓ İlerlememi Yükle</button>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  // =========================================================================
  // 7. CHART.JS GRAFİKLERİ (UNUTMA, GELİŞİM & KONU HAKİMİYETİ)
  // =========================================================================
  let _charts = [];
  function mountStatsCharts() {
    _charts.forEach(c => { try { c.destroy(); } catch (_) {} });
    _charts = [];
    if (typeof Chart === 'undefined' || state.activeTab !== 'stats') return;

    const m = computeMetrics();
    const isDark = state.darkMode;
    const grid = isDark ? 'rgba(148,163,184,0.15)' : 'rgba(148,163,184,0.25)';
    const txt = isDark ? '#cbd5e1' : '#334155';

    // 1. Ebbinghaus Unutma Eğrisi
    const c1 = document.getElementById('chart-forgetting');
    if (c1) {
      const days = [0, 1, 2, 3, 5, 7, 10, 14, 21, 30];
      const rawCurve = days.map(d => Math.round(Math.exp(-d / 1.5) * 100));
      const userCurve = days.map(d => Math.round(Math.exp(-d / Math.max(1.5, m.avgStability)) * 100));
      _charts.push(new Chart(c1, {
        type: 'line',
        data: {
          labels: days.map(d => `${d}. gün`),
          datasets: [
            { label: 'Tekrarsız Ham Unutma (S=1.5g)', data: rawCurve, borderColor: '#e11d48', borderDash: [5, 4], tension: 0.35, borderWidth: 2, pointRadius: 2 },
            { label: `Senin SM-2 Hafıza Eğrin (S=${m.avgStability}g)`, data: userCurve, borderColor: '#059669', backgroundColor: 'rgba(5,150,105,0.12)', fill: true, tension: 0.35, borderWidth: 3, pointRadius: 3 }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { labels: { color: txt, font: { size: 11, weight: '600' } } } },
          scales: {
            x: { ticks: { color: txt, font: { size: 10 } }, grid: { color: grid } },
            y: { min: 0, max: 105, title: { display: true, text: 'Hatırlama Olasılığı (%)', color: txt, font: { size: 10 } }, ticks: { color: txt }, grid: { color: grid } }
          }
        }
      }));
    }

    // 2. Gelişim Eğrisi
    const c2 = document.getElementById('chart-growth');
    if (c2) {
      const hist = state.history.length ? state.history : [{ label: 'Başlangıç', accuracy: 0, mastered: 0 }];
      _charts.push(new Chart(c2, {
        type: 'line',
        data: {
          labels: hist.map(h => h.label),
          datasets: [
            { label: 'Hatırlama Doğruluğu (%)', data: hist.map(h => h.accuracy), borderColor: '#4f46e5', backgroundColor: 'rgba(79,70,229,0.12)', fill: true, tension: 0.35, borderWidth: 2.5 },
            { label: 'Ustalaşılan Kart Sayısı', data: hist.map(h => h.mastered), borderColor: '#f59e0b', tension: 0.35, borderWidth: 2.5 }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { labels: { color: txt, font: { size: 11, weight: '600' } } } },
          scales: {
            x: { ticks: { color: txt, font: { size: 10 } }, grid: { color: grid } },
            y: { min: 0, max: 105, ticks: { color: txt }, grid: { color: grid } }
          }
        }
      }));
    }

    // 3. Konu Bazlı Hakimiyet
    const c3 = document.getElementById('chart-topics');
    if (c3) {
      _charts.push(new Chart(c3, {
        type: 'bar',
        data: {
          labels: m.topicStats.map(t => t.short),
          datasets: [{
            label: 'Konu Hakimiyeti (%)',
            data: m.topicStats.map(t => t.pct),
            backgroundColor: m.topicStats.map(t => t.pct >= 75 ? '#10b981' : t.pct >= 40 ? '#6366f1' : '#f43f5e'),
            borderRadius: 8
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: txt, font: { size: 10, weight: '600' } }, grid: { display: false } },
            y: { min: 0, max: 100, title: { display: true, text: 'Hakimiyet (%)', color: txt, font: { size: 10 } }, ticks: { color: txt }, grid: { color: grid } }
          }
        }
      }));
    }
  }

  function updateNavUI() {
    const cBtn = document.getElementById('clinic-mode-btn');
    if (cBtn) {
      cBtn.textContent = state.showExtraClinic ? '🏥 Ekstra Klinik: Açık' : '🏥 Ekstra Klinik: Kapalı';
      cBtn.className = state.showExtraClinic
        ? 'px-2.5 py-1.5 rounded-lg border border-sky-500 bg-sky-600 text-white text-xs font-bold transition whitespace-nowrap shadow-sm'
        : 'px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-bold transition whitespace-nowrap';
    }
    ['anki', 'turbo', 'exam', 'stats'].forEach(t => {
      const b = document.getElementById(`nav-${t}`);
      if (!b) return;
      b.className = state.activeTab === t
        ? 'px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-bold transition whitespace-nowrap bg-white dark:bg-slate-900 text-indigo-600 dark:text-indigo-400 shadow-sm'
        : 'px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-bold transition whitespace-nowrap text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white';
    });
  }

  function render() {
    updateNavUI();
    const main = document.getElementById('main-content');
    if (!main) return;
    if (state.activeTab === 'anki') main.innerHTML = renderAnki();
    else if (state.activeTab === 'turbo') main.innerHTML = renderTurbo();
    else if (state.activeTab === 'exam') main.innerHTML = renderExam();
    else main.innerHTML = renderStats();
    renderSyncModal();
    mountStatsCharts();
  }

  // =========================================================================
  // 8. OLAY YÖNETİMİ & KLAVYE KISAYOLLARI
  // =========================================================================
  function findAction(node) {
    let cur = node;
    while (cur && cur !== document) {
      if (cur.getAttribute && cur.getAttribute('data-stop-prop') === 'true') return null;
      if (cur.getAttribute && cur.getAttribute('data-action')) return cur;
      cur = cur.parentNode;
    }
    return null;
  }

  document.addEventListener('click', (e) => {
    const btn = findAction(e.target);
    if (!btn) return;
    const action = btn.getAttribute('data-action');

    if (action === 'set-tab') {
      state.activeTab = btn.getAttribute('data-tab');
      render();
    } else if (action === 'toggle-theme') {
      state.darkMode = !state.darkMode;
      applyTheme();
      saveLocal();
      render();
    } else if (action === 'toggle-clinic-mode') {
      state.showExtraClinic = !state.showExtraClinic;
      saveLocal();
      showToast(state.showExtraClinic ? 'Ekstra Klinik & Tedavi notları açıldı' : 'Sade Temel Bilim modu aktif (Ekstra Klinik gizli)', 'indigo');
      render();
    } else if (action === 'open-sync') {
      state.syncModalOpen = true;
      renderSyncModal();
    } else if (action === 'close-sync') {
      state.syncModalOpen = false;
      renderSyncModal();
    } else if (action === 'copy-mem-link') {
      copyText(generateMemoryLink(), 'Kişisel Hafıza Linki kopyalandı!');
    } else if (action === 'copy-mem-code') {
      copyText(generateMemoryCode(), 'Kişisel Hafıza Kodu kopyalandı!');
    } else if (action === 'import-mem-link') {
      const inp = document.getElementById('mem-link-in');
      if (inp && loadFromMemoryString(inp.value)) {
        state.syncModalOpen = false;
        state.currentCardId = null;
        showToast('Harika! Kaldığın yerden tüm ilerlemen yüklendi.', 'emerald');
        render();
      } else {
        showToast('Geçersiz hafıza linki veya kodu!', 'rose');
      }
    } else if (action === 'export-tsv') {
      exportAnkiTSV();
    } else if (action === 'toggle-hint') {
      state.showHint = !state.showHint;
      render();
    } else if (action === 'flip-anki') {
      state.flipped = true;
      render();
    } else if (action === 'rate-anki') {
      const q = Number(btn.getAttribute('data-q'));
      if (state.currentCardId) {
        applySM2(state.currentCardId, q);
        if (q === 1) showToast('Kart 12 kart sonrasına ertelendi (araya yeni kartlar girecek).', 'amber');
        state.currentCardId = null;
        state.flipped = false;
        state.showHint = false;
        render();
      }
    } else if (action === 'turbo-filter') {
      state.turboFilter = btn.getAttribute('data-val');
      state.turboIndex = 0;
      state.turboRevealed = false;
      render();
    } else if (action === 'turbo-flip') {
      state.turboRevealed = !state.turboRevealed;
      render();
    } else if (action === 'turbo-mark') {
      const ok = btn.getAttribute('data-ok') === '1';
      const pool = getTurboPool();
      const card = pool[state.turboIndex % pool.length];
      if (card) applySM2(card.id, ok ? 3 : 1);
      state.turboSessionCount += 1;
      state.turboIndex += 1;
      state.turboRevealed = false;
      render();
    } else if (action === 'exam-mode') {
      state.examMode = btn.getAttribute('data-mode');
      const maxLen = state.examMode === 'open' ? OPEN_BANK.length : EXAM_BANK.length;
      if (state.examSize > maxLen) state.examSize = maxLen;
      render();
    } else if (action === 'exam-size') {
      state.examSize = Number(btn.getAttribute('data-val'));
      render();
    } else if (action === 'start-exam') {
      const bank = state.examMode === 'open' ? OPEN_BANK : EXAM_BANK;
      let pool = bank.filter(q => state.examTopic === 'all' || q.topic === state.examTopic);
      pool = [...pool].sort(() => Math.random() - 0.5).slice(0, Math.min(state.examSize, pool.length));
      state.examQuestions = pool;
      state.examAnswers = {};
      state.examIndex = 0;
      state.examActive = true;
      state.examFinished = false;
      state.examStartTime = Date.now();
      render();
      const inp = document.getElementById('open-answer-input');
      if (inp) inp.focus();
    } else if (action === 'open-check') {
      const q = state.examQuestions[state.examIndex];
      const inp = document.getElementById('open-answer-input');
      const txt = inp ? inp.value.trim() : '';
      const matched = isOpenAnswerMatch(txt, q.accepted);
      if (matched) {
        state.examAnswers[q.id] = { text: txt, status: 'exact', revealed: true };
        if (q.cardId) applySM2(q.cardId, 4); // Direkt biliyorum -> SM-2 Kolay!
        showToast('Tam doğru! Biliyorum olarak kaydedildi.', 'emerald');
      } else {
        state.examAnswers[q.id] = { text: txt, status: null, revealed: true };
      }
      render();
    } else if (action === 'open-skip-reveal') {
      const q = state.examQuestions[state.examIndex];
      const inp = document.getElementById('open-answer-input');
      const txt = inp ? inp.value.trim() : '';
      state.examAnswers[q.id] = { text: txt, status: null, revealed: true };
      render();
    } else if (action === 'open-self-rate') {
      const q = state.examQuestions[state.examIndex];
      const st = btn.getAttribute('data-status'); // 'none' | 'recognized' | 'tip'
      const prev = state.examAnswers[q.id] || { text: '', revealed: true };
      state.examAnswers[q.id] = { ...prev, status: st, revealed: true };
      if (q.cardId) {
        const sm2Q = st === 'tip' ? 3 : st === 'recognized' ? 2 : 1;
        applySM2(q.cardId, sm2Q);
      }
      if (state.examIndex < state.examQuestions.length - 1) {
        state.examIndex += 1;
        render();
        const inp = document.getElementById('open-answer-input');
        if (inp) inp.focus();
      } else {
        // Son soruyu derecelendirince direkt karneyi aç
        state.examActive = false;
        state.examFinished = true;
        state.examElapsedSec = Math.max(1, Math.round((Date.now() - state.examStartTime) / 1000));
        let pts = 0;
        state.examQuestions.forEach(item => {
          const r = state.examAnswers[item.id] || {};
          pts += r.status === 'exact' ? 1 : r.status === 'tip' ? 0.75 : r.status === 'recognized' ? 0.35 : 0;
        });
        const pct = Math.round((pts / state.examQuestions.length) * 100);
        state.examHistory.push({
          date: new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }),
          modeLabel: 'Açık Uçlu',
          score: Number(pts.toFixed(1)),
          total: state.examQuestions.length,
          pct
        });
        saveLocal();
        showToast(`Açık uçlu sınav bitti: %${pct} hakimiyet!`, pct >= 70 ? 'emerald' : 'amber');
        render();
      }
    } else if (action === 'exam-pick') {
      const qid = btn.getAttribute('data-qid');
      const idx = Number(btn.getAttribute('data-idx'));
      state.examAnswers[qid] = idx;
      render();
    } else if (action === 'exam-prev') {
      if (state.examIndex > 0) state.examIndex -= 1;
      render();
    } else if (action === 'exam-next') {
      if (state.examIndex < state.examQuestions.length - 1) state.examIndex += 1;
      render();
      const inp = document.getElementById('open-answer-input');
      if (inp) inp.focus();
    } else if (action === 'finish-exam') {
      state.examActive = false;
      state.examFinished = true;
      state.examElapsedSec = Math.max(1, Math.round((Date.now() - state.examStartTime) / 1000));
      let score = 0;
      if (state.examMode === 'open') {
        state.examQuestions.forEach(item => {
          const r = state.examAnswers[item.id] || {};
          score += r.status === 'exact' ? 1 : r.status === 'tip' ? 0.75 : r.status === 'recognized' ? 0.35 : 0;
        });
      } else {
        state.examQuestions.forEach(q => { if (state.examAnswers[q.id] === q.ans) score += 1; });
      }
      const pct = Math.round((score / state.examQuestions.length) * 100);
      state.examHistory.push({
        date: new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }),
        modeLabel: state.examMode === 'open' ? 'Açık Uçlu' : '5 Şıklı',
        score: Number(score.toFixed(1)),
        total: state.examQuestions.length,
        pct
      });
      saveLocal();
      showToast(`Sınav tamamlandı: %${pct} başarı!`, pct >= 70 ? 'emerald' : 'amber');
      render();
    } else if (action === 'reset-exam') {
      state.examActive = false;
      state.examFinished = false;
      render();
    } else if (action === 'jump-topic-anki') {
      state.activeTab = 'anki';
      state.topicFilter = btn.getAttribute('data-topic');
      state.currentCardId = null;
      state.flipped = false;
      state.showHint = false;
      render();
    }
  });

  document.addEventListener('change', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const act = el.getAttribute('data-action');
    if (act === 'anki-topic-filter') {
      state.topicFilter = el.value;
      state.currentCardId = null;
      state.flipped = false;
      state.showHint = false;
      render();
    } else if (act === 'turbo-topic-select') {
      state.turboFilter = el.value;
      state.turboIndex = 0;
      state.turboRevealed = false;
      render();
    } else if (act === 'exam-topic') {
      state.examTopic = el.value;
      render();
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.target.id === 'open-answer-input' && e.key === 'Enter') {
      e.preventDefault();
      const chkBtn = document.querySelector('[data-action="open-check"]');
      if (chkBtn) chkBtn.click();
      return;
    }
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
    if (state.syncModalOpen && e.key === 'Escape') {
      state.syncModalOpen = false;
      renderSyncModal();
      return;
    }
    if (state.activeTab === 'anki') {
      if (e.key === ' ' && !state.flipped) {
        e.preventDefault();
        state.flipped = true;
        render();
      } else if ((e.key === 'h' || e.key === 'H') && !state.flipped) {
        state.showHint = !state.showHint;
        render();
      } else if (state.flipped && ['1', '2', '3', '4'].includes(e.key) && state.currentCardId) {
        applySM2(state.currentCardId, Number(e.key));
        state.currentCardId = null;
        state.flipped = false;
        state.showHint = false;
        render();
      }
    }
  });

  loadLocal();
  applyTheme();
  render();
})();
</script>
</body>
</html>
