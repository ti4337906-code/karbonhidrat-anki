  // =========================================================================
  const CARDS = [
    // --- 1. KH KİMYASI (s.1-19) ---
    { id: 'c01', topic: 'chem', page: 's.10', tag: 'Spot',
      q: 'Asimetrik (kiral) karbon atomu İÇERMEYEN tek monosakkarit hangisidir?',
      hint: '3 karbonlu ketotriozdur; simetrik iki CH₂OH ucu vardır.',
      a: 'Dihidroksiaseton (Ketotrioz)',
      why: 'Dihidroksiasetonun (HOCH₂–CO–CH₂OH) hiçbir karbonu 4 farklı gruba bağlı değildir. Gliseraldehit (1), ketopentoz (2), aldopentoz/ketoheksoz (3), aldoheksoz (4) asimetrik karbon içerir.',
      trap: 'Stereoizomer sayısı 2ⁿ formülüyle hesaplanır: Aldoheksozda 2⁴ = 16 stereoizomer (8 D, 8 L) vardır.' },
    { id: 'c02', topic: 'chem', page: 's.6, 12', tag: 'Epimer & Anomer',
      q: 'D-Glikozun C2 epimeri ve C4 epimeri olan aldoheksozlar sırasıyla hangileridir?',
      hint: 'Biri M ile başlar, diğeri süt şekerinin parçasıdır.',
      a: 'C2 epimeri: D-Mannoz | C4 epimeri: D-Galaktoz',
      why: 'Epimerler yalnızca tek bir asimetrik karbon atomundaki -OH yönelimiyle farklılaşır. Galaktoz metabolizmasında UDP-Galaktoz 4-Epimeraz bu C4 farkını düzeltir.',
      trap: 'Anomer (α vs β) ise halka kapanınca yeni oluşan C1 (aldoz) veya C2 (ketoz) karbonundaki -OH yönelimidir.' },
    { id: 'c03', topic: 'chem', page: 's.15-18', tag: 'Disakkarit Bağı',
      q: 'Sükroz (Sakkaroz) ve Trehaloz neden İNDİRGEYİCİ (redüktan) şeker DEĞİLDİR?',
      hint: 'Glikozid bağının hangi karbonlar arasında kurulduğunu düşün.',
      a: 'Her iki monosakkaritin de anomerik (asetal) karbonları glikozid bağına katıldığı için serbest asetal hidroksilleri yoktur.',
      why: 'Sükrozda α-(1,2) (Glikoz C1 + Früktoz C2), Trehalozda α-(1,1) bağı vardır. Maltoz α-(1,4) ve Laktoz β-(1,4) ise serbest anomerik karbon taşıdığı için indirgeyicidir.',
      trap: 'Sınav tuzağı: Laktoz (β-1,4) ve Maltoz (α-1,4) indirgeyicidir; Sükroz ve Trehaloz indirgeyici değildir!' },
    { id: 'c04', topic: 'chem', page: 's.19', tag: 'Polisakkarit',
      q: 'Homopolisakkarit olan ve böbrekte GFR (glomerüler filtrasyon hızı) ölçümünde kullanılan früktoz polimeri hangisidir?',
      hint: 'PDF s.19 homopolisakkarit listesinin son elemanı; insülinle karıştırılır!',
      a: 'İnülin',
      why: 'Homopolisakkaritler: Nişasta, Glikojen, Sellüloz, Dekstran, İnülin. Heteropolisakkaritler (GAG): Hiyaluronik asit, Kondroitin sülfat, Keratan sülfat, Heparin.',
      trap: 'İnülin (früktoz polimeri) ile İnsülin (hormon) sınavda bilerek karıştırılır.' },

    // --- 2. SİNDİRİM & EMİLİM (s.20-24) ---
    { id: 'c05', topic: 'digest', page: 's.22', tag: 'Sindirim',
      q: 'Tükürük ve pankreas α-amilazları nişastadaki hangi bağları kırar, hangilerini KIRAMAZ?',

      a: 'Yalnızca iç α-(1,4) bağlarını kırar; dallanma noktalarındaki α-(1,6) bağlarını kıramaz.',
      why: 'Sonuçta serbest glikoz değil; %40 Maltoz, %25 Maltotrioz, %30 Sınır dekstrinleri ve %5 Oligosakkarit oluşur. Son parçalama ince bağırsak fırçamsı kenarındaki α-glikozidaz ve α-dekstrinazla yapılır.',
      trap: 'Akarboz ilacı ince bağırsak α-glikozidazını inhibe ederek Tip 2 DM’de tokluk şekerini düşürür.' },
    { id: 'c06', topic: 'digest', page: 's.23', tag: 'Taşıyıcılar',
      q: 'İnce bağırsak lümeninden enterosit içine Glikoz/Galaktoz ile Früktoz sırasıyla hangi taşıyıcılarla girer?',
      hint: 'Biri 2 Na⁺ ile sekonder aktif taşıma yapar, diğeri pasif kolaylaştırılmış difüzyondur.',
      a: 'Glikoz & Galaktoz: SGLT-1 (2 Na⁺ bağımlı) | Früktoz: GLUT-5 (Na⁺ bağımsız)',
      why: 'SGLT-1’in çalışması için gereken Na⁺ gradyentini bazolateral membrandaki Na⁺-K⁺ ATPaz sağlar. Her üç monosakkarit de enterositten kana bazolateral GLUT-2 ile geçer.',
      trap: 'İshalde ORS (tuzlu-şekerli su) tedavisinin temeli SGLT-1’in Na⁺ + Glikozla birlikte su çekmesidir!' },
    { id: 'c07', topic: 'digest', page: 's.24', tag: 'Klinik',
      q: 'Fırçamsı kenar laktaz eksikliğinde (Laktoz İntoleransı) ishal ve gazın mekanizması nedir?',
      hint: 'Sindirilemeyen disakkarit kolona ulaşınca iki şey olur.',
      a: 'Laktoz kolonda ozmotik su çeker (ozmotik ishal) ve kolon bakterilerince fermente edilerek gaz (H₂, CO₂) ve organik asit oluşturur.',
      why: 'Laktaz, laktozun β-(1,4) glikozid bağını kırar. Eksikliğinde süt ürünlerinden sonra şişkinlik, kramp ve sulu ishal görülür.',
      trap: 'Laktoz intoleransı bir süt proteini alerjisi DEĞİLDİR; tamamen enzim eksikliğidir.' },

    // --- 3. GLİKOLİZ & 2,3-BPG (s.27-57) ---
    { id: 'c08', topic: 'glyc', page: 's.29-30', tag: 'Temel Mantık',
      q: 'Glikoz hücreye girer girmez Heksokinaz/Glikokinaz ile neden 6. karbonundan fosfatlanır?',
      hint: 'Hücre zarındaki GLUT taşıyıcılarının yapısını düşün.',
      a: 'Negatif yüklü fosfat grubu eklenince Glikoz 6-P zardan/GLUT’tan dışarı çıkamaz (hücre içinde hapsedilir).',
      why: 'Ayrıca hücre içi serbest glikoz düşük tutulduğu için konsantrasyon farkıyla dışarıdan yeni glikoz girişi kolaylaşır.',
      trap: 'Karaciğer ve böbrekteki Glikoz 6-fosfataz bu fosfatı koparmadan glikoz kana geri çıkamaz!' },
    { id: 'c09', topic: 'glyc', page: 's.30', tag: 'Enzim Kinetiği',
      q: 'Heksokinaz (tüm dokular) ile Glikokinaz (karaciğer & pankreas β) arasındaki 3 temel fark nedir?',
      hint: 'Km, Vmax, G6P inhibisyonu ve insülin yanıtı.',
      a: 'Glikokinaz: Yüksek Km (düşük ilgi), yüksek Vmax, G6P ile İNHİBE OLMAZ ve İnsülinle indüklenir.',
      why: 'Açlıkta düşük Km’li Heksokinaz beyin/kası besler; toklukta yüksek Km’li Glikokinaz kan şekeri yükselince devreye girip karaciğerde glikojenez için glikozu hızla çeker.',
      trap: 'Glikokinaz mutasyonu MODY Tip 2 diyabete yol açar.' },
    { id: 'c10', topic: 'glyc', page: 's.34-35', tag: 'Hız Kısıtlayıcı',
      q: 'Glikolizin ANA hız kısıtlayıcı enzimi hangisidir? En güçlü aktivatörü ve 4 ana inhibitörü nedir?',
      hint: '3. basamak — geri dönüşsüz karar noktası.',
      a: 'Fosfofrüktokinaz-1 (PFK-1). En güçlü aktivatör: Früktoz 2,6-bisfosfat (ayrıca AMP, ADP). İnhibitörler: ATP, Sitrat, H⁺ (asidoz), Yağ asitleri.',
      why: 'G6P başka yolaklara gidebilir ama F-1,6-BP artık yalnızca glikolize mahkumdur. Kas PFK-1 eksikliği Tarui hastalığıdır (GSD Tip VII).',
      trap: 'Dikkat: ATP hem PFK-1’in substratı hem de yüksek dozda allosterik inhibitörüdür!' },
    { id: 'c11', topic: 'glyc', page: 's.36, 41', tag: 'Hormonal Kontrol',
      q: 'Açlıkta Glukagon, karaciğerde bifonksiyonel PFK-2 / FBPaz-2 enzimini PKA ile fosforilleyince ne olur?',
      hint: 'F-2,6-BP düzeyi artar mı, azalır mı?',
      a: 'PFK-2 İNAKTİF, FBPaz-2 AKTİF olur → Früktoz 2,6-bisfosfat AZALIR → PFK-1 (glikoliz) frenlenir, F-1,6-BPaz (glikoneojenez) açılır!',
      why: 'İnsülin ise Protein Fosfatazı aktive edip fosfatı koparır → PFK-2 aktif → F-2,6-BP artar → karaciğerde glikoliz hızlanır.',
      trap: 'PFK-1 ile PFK-2’yi karıştırma: PFK-1 glikoliz yolundadır (F-1,6-BP yapar); PFK-2 sadece düzenleyici F-2,6-BP üretir!' },
    { id: 'c12', topic: 'glyc', page: 's.43-44', tag: 'İnhibitör',
      q: 'Arsenat (AsO₄³⁻) Gliseraldehit 3-fosfat Dehidrojenaz (GAPDH) basamağında ne yapar?',
      hint: 'Glikoliz durur mu, yoksa devam edip ATP’yi mi sıfırlar?',
      a: 'İnorganik fosfat (Pi) yerine geçerek 1-arseno-3-fosfogliserat oluşturur; bu bileşik spontan hidroliz olduğu için glikoliz devam eder ama PGK basamağındaki ATP üretimi SIFIRLANIR (Net 0 ATP)!',
      why: 'İyodoasetat ise GAPDH’ın aktif merkezindeki -SH grubunu bloke edip glikolizi tamamen durdurur.',
      trap: 'Arsenat (As⁵⁺) = Glikoliz ATP’sini sıfırlar; Arsenit (As³⁺) = PDH & α-KGDH’daki lipoatı bloke eder!' },
    { id: 'c13', topic: 'glyc', page: 's.47', tag: 'Laboratuvar & İnhibitör',
      q: 'Kan şekeri ölçüm tüplerine (gri kapaklı tüp) konulan Sodyum Florür (NaF) hangi enzimi inhibe eder?',
      hint: '2-Fosfogliserat → Fosfoenolpiruvat basamağı.',
      a: 'Enolaz (Mg²⁺ ile florofosfat kompleksi oluşturarak)',
      why: 'Tüpteki eritrositlerin laboratuvara gidene kadar glikoliz yapıp kan şekerini yalancı düşük göstermesini önler.',
      trap: 'Glikolizde Mg²⁺ gerektiren enzimler: Kinazlar (HK, PFK-1, PGK, PK) ve Enolaz.' },
    { id: 'c14', topic: 'glyc', page: 's.48-49', tag: 'Klinik & Regülasyon',
      q: 'Piruvat Kinazın ileri-besleme (feed-forward) aktivatörü nedir ve eksikliğinde hangi tablo görülür?',
      hint: 'Yukarıdaki bir glikoliz ara ürünü aşağıyı uyarır; eritrositleri düşün.',
      a: 'Aktivatör: Früktoz 1,6-bisfosfat. Eksikliği: Eritrositlerde ATP yetersizliğine bağlı kronik hemolitik anemi (2. en sık enzimopati).',
      why: 'İnhibitörleri: ATP, Alanin, Asetil-KoA, Yağ asitleri ve Glukagon (PKA fosforilasyonu → inaktif). PK eksikliğinde blokajın üstünde 2,3-BPG biriktiği için hastalar anemiyi görece iyi tolere eder.',
      trap: 'Glikolizin 3 geri dönüşümsüz enzimi: Heksokinaz/Glikokinaz, PFK-1, Piruvat Kinaz.' },
    { id: 'c15', topic: 'glyc', page: 's.52-53', tag: 'Anaerobik Glikoliz',
      q: 'Oksijen yokluğunda veya eritrositte Piruvatın LDH ile Laktata dönüşmesinin ASIL biyokimyasal amacı nedir?',
      hint: 'Bu basamakta ATP üretilmez; GAPDH’ın devamı için ne lazım?',
      a: 'GAPDH basamağında tüketilen NAD⁺’ı yenileyerek glikolizin durmasını önlemek.',
      why: 'Anaerobik glikolizde 1 Glikoz → 2 Laktat + 2 ATP (net). Mitokondrisiz eritrositlerin tek enerji kaynağıdır.',
      trap: 'Laktat oluşumu ekstra ATP üretmez; sadece 2 ATP’lik glikolizin kilitlenmeden sürmesini sağlar.' },
    { id: 'c16', topic: 'glyc', page: 's.56', tag: '2,3-BPG Şantı',
      q: 'Eritrositlerdeki Rapoport-Luebering (2,3-BPG) şantı hangi basamağı atlar ve ne işe yarar?',
      hint: '1,3-BPG → 2,3-BPG → 3-Fosfogliserat.',
      a: 'Fosfogliserat Kinaz (ATP üreten) basamağını atlar; oluşan 2,3-BPG hemoglobinin O₂ ilgisini azaltarak (eğriyi sağa kaydırıp) dokulara O₂ bırakılmasını kolaylaştırır.',
      why: 'Bisfosfogliserat mutaz 1,3-BPG’yi 2,3-BPG’ye çevirir. Yüksek rakım ve kronik hipokside bu şant artar.',
      trap: 'Şant aktifken bu basamaktan ATP kazanılmaz ama eritrosit için doku oksijenasyonu hayati önceliktir.' },

    // --- 4. PDH KOMPLEKSİ (s.58-66) ---
    { id: 'c17', topic: 'pdh', page: 's.58-65', tag: '5 Koenzim Şifresi',
      q: 'Piruvat Dehidrojenaz (PDH) kompleksinin 3 enzimi ve 5 koenzimi ("TLC For Nancy") nelerdir?',
      hint: 'B1, Lipoat, B5, B2, B3 vitamin türevleri.',
      a: 'E1 (PDH), E2 (Dihidrolipoil transasetilaz), E3 (Dihidrolipoil DH) | 5 Koenzim: TPP (B1), Lipoat, KoA (B5), FAD (B2), NAD⁺ (B3).',
      why: 'Mitokondri matrisinde 1 Piruvat → 1 Asetil-KoA + 1 CO₂ + 1 NADH + H⁺ (1 glikoz için 2 NADH = 5 ATP). Reaksiyon KESİNLİKLE GERİ DÖNÜŞÜMSÜZDÜR!',
      trap: 'Aynı 5 koenzim Krebs’teki α-Ketoglutarat Dehidrojenaz kompleksinde de birebir kullanılır!' },
    { id: 'c18', topic: 'pdh', page: 's.66', tag: 'Kovalent Kontrol',
      q: 'PDH kompleksi fosforilasyonla mı yoksa defosforilasyonla mı AKTİF olur? İnsülin ve Ca²⁺ ne yapar?',
      hint: 'Glikojen fosforilazın tam tersi!',
      a: 'DEFOSFORİLE PDH = AKTİF | FOSFORİLE PDH = İNAKTİF. İnsülin ve Ca²⁺, PDH Fosfatazı uyararak PDH’yi AKTİVE eder.',
      why: 'Asetil-KoA, NADH ve ATP ise PDH Kinazı aktive edip E1’i fosforiller (inaktif). Piruvat ve Ca²⁺ PDH kinazı inhibe eder.',
      trap: 'Sınav tuzağı: PDH Kinaz enzimi PDH’yi AÇMAZ, KAPATIR!' },
    { id: 'c19', topic: 'pdh', page: 's.59-61', tag: 'Klinik & Toksin',
      q: 'Alkolik hastaya IV dekstroz (glikoz) vermeden önce neden Tiamin (B1) verilir? Arsenit/Cıva PDH’de nereyi bağlar?',
      hint: 'E1 (TPP) ve E2 (Lipoat -SH).',
      a: 'B1 eksikliğinde glikoz yüklenirse PDH (E1-TPP) tıkalı olduğundan piruvat laktata yığılır ve akut Wernicke ensefalopatisi + laktik asidoz gelişir. Arsenit/Cıva E2’deki Lipoatın -SH gruplarını bağlar.',
      why: 'Konjenital PDH eksikliğinde de laktik asidoz görülür ve tedavisinde PDH’yi atlayıp doğrudan Asetil-KoA veren KETOJENİK DİYET (yağlar, lösin, lizin) uygulanır.',
      trap: 'PDH tek yönlü olduğu için insan vücudu çift karbonlu yağ asitlerinden (Asetil-KoA) asla net glikoz üretemez!' },

    // --- 5. KREBS (TCA) & MEKİKLER (s.67-92) ---
    { id: 'c20', topic: 'tca', page: 's.77-78', tag: 'Enerji Bilançosu',
      q: '1 mol Asetil-KoA’nın Sitrik Asit Siklusunda oksidasyonundan net ne elde edilir (kaç ATP)?',
      hint: '3 NADH + 1 FADH₂ + 1 GTP.',
      a: '2 CO₂ + 3 NADH (7,5 ATP) + 1 FADH₂ (1,5 ATP) + 1 GTP (1 ATP) = TOPLAM 10 ATP (1 Glikoz = 2 tur = 20 ATP).',
      why: 'PDF s.78’de eski/yeni hesap yanında s.79’da güncel Hinkle oranlarıyla (1 NADH = 2,5 ATP; 1 FADH₂ = 1,5 ATP) 2 tur Krebs = 20 ATP olarak verilir.',
      trap: 'Krebs’teki TEK substrat düzeyinde fosforilasyon basamağı Süksinat Tiyokinazdır (Süksinil-KoA → Süksinat + GTP).' },
    { id: 'c21', topic: 'tca', page: 's.90', tag: 'Hız Kısıtlayıcı',
      q: 'Sitrik Asit Siklusunun 3 geri dönüşümsüz enzimi ve ANA hız kısıtlayıcı basamağı hangisidir?',
      hint: 'ADP ile güçlü aktive olan 3. basamak.',
      a: '3 Geri Dönüşümsüz: Sitrat sentaz, İzositrat DH, α-Ketoglutarat DH. ANA Hız Kısıtlayıcı: İzositrat Dehidrojenaz (ADP & NAD⁺ aktive; ATP & NADH inhibe eder).',
      why: 'Sitrat sentaz (ATP, NADH, Sitrat, Süksinil-KoA ile inhibe) ve α-KGDH (ATP, NADH, Süksinil-KoA ile inhibe) diğer kontrol noktalarıdır.',
      trap: 'Krebs’te O₂ doğrudan hiçbir basamağa girmez ama O₂ yoksa NADH/FADH₂ oksitlenemediği için döngü hemen durur.' },
    { id: 'c22', topic: 'tca', page: 's.69, 71, 74', tag: 'İnhibitör Üçlüsü',
      q: 'Krebs döngüsünün 3 klasik toksin/inhibitörü (Floroasetat, Arsenit, Malonat) hangi enzimleri durdurur?',
      hint: 'Akonitaz, α-KGDH, Süksinat DH.',
      a: 'Floroasetat (→ Florositrat): Akonitaz | Arsenit: α-Ketoglutarat DH (lipoat) | Malonat: Süksinat DH (kompetitif inhibitör).',
      why: 'Süksinat Dehidrojenaz aynı zamanda mitokondri İÇ MEMBRANINA gömülü (ETZ Kompleks II) tek Krebs enzimidir.',
      trap: 'Malonat yarışmalı (kompetitif) inhibitördür; ortamda Süksinat artırılırsa inhibisyon aşılabilir.' },
    { id: 'c23', topic: 'tca', page: 's.79-82', tag: 'Mekik Sistemleri',
      q: '1 Glikozun aerobik oksidasyonunda neden bazen 30 ATP, bazen 32 ATP elde edilir?',
      hint: 'Glikolizdeki 2 sitozolik NADH mitokondriye hangi mekikle girer?',
      a: 'Gliserol 3-P Mekiği (iskelet kası/beyin) elektronları FAD’a verir (+3 ATP → 30 ATP) | Malat-Aspartat Mekiği (karaciğer/kalp/böbrek) NAD⁺’a verir (+5 ATP → 32 ATP).',
      why: 'Sabit kazançlar: Glikoliz 2 ATP + PDH 5 ATP + 2 tur Krebs 20 ATP = 27 ATP. Mekik (+3 veya +5) ile 30 veya 32 ATP olur.',
      trap: 'NADH mitokondri iç membranından doğrudan geçemez; sadece elektronları mekikle taşınır.' },
    { id: 'c24', topic: 'tca', page: 's.87-92', tag: 'Sitrat Mekiği & Anapleroz',
      q: 'Mitokondrideki Asetil-KoA yağ asidi sentezi için sitozole hangi molekül halinde çıkar ve hangi enzimle parçalanır?',
      hint: 'Asetil-KoA zardan geçemez; 6 karbonlu moleküle dönüşüp çıkar.',
      a: 'Sitrat halinde çıkar (Sitrat Mekiği) ve sitozolde ATP-Sitrat Liyaz ile tekrar Asetil-KoA + Oksalasetat’a ayrılır.',
      why: 'Sitozoldeki Oksalasetat Malata döner; Malat ise Malik Enzimle Piruvata dönerken yağ sentezi için NADPH üretir! Krebs’ten eksilen OAA’yı mitokondride dolduran ana anaplerotik enzim Piruvat Karboksilazdır.',
      trap: 'Krebs’te HEM sentezine giden ara ürün: Süksinil-KoA!' },

    // --- 6. PENTOZ FOSFAT YOLU & RADİKALLER (s.93-125) ---
    { id: 'c25', topic: 'ppp', page: 's.26, 94', tag: 'NADPH Kaynak & Kullanım',
      q: 'Hücrede NADPH üreten 3 reaksiyon ve NADPH’ın kullanıldığı 5 ana olay nedir?',
      hint: 'PPP ana kaynaktır; diğer ikisi Malik enzim ve NADP⁺-İzositrat DH.',
      a: 'Üretenler: 1) Pentoz Fosfat Yolu, 2) Malik Enzim, 3) NADP⁺-bağımlı İzositrat DH. Kullananlar: Yağ asidi, Kolesterol, Steroid hormon sentezleri + İlaç detoksifikasyonu + Glutatyon rejenerasyonu.',
      why: 'Pentoz Fosfat Yolu tamamen sitozoldedir; ATP üretmez ve ATP harcamaz.',
      trap: 'Sınav tuzağı: NADH katabolik (ATP üretimi), NADPH ise anabolik (biyosentez + antioksidan) koenzimdir!' },
    { id: 'c26', topic: 'ppp', page: 's.95-97', tag: 'Hız Kısıtlayıcı',
      q: 'Pentoz Fosfat Yolunun hız kısıtlayıcı enzimi hangisidir ve hızını belirleyen ana şalter nedir?',
      hint: 'Oksidatif fazın 1. enzimi.',
      a: 'Glikoz 6-fosfat Dehidrojenaz (G6PD). Ana uyarıcı şalter: Sitozoldeki NADP⁺ düzeyi (NADPH ise güçlü kompetitif inhibitördür).',
      why: 'Oksidatif fazda 1 G6P → 1 Ribüloz 5-P + 2 NADPH + 2 H⁺ + 1 CO₂ (geri dönüşümsüz).',
      trap: '6 G6P tam geri dönüşüm döngüsüne girerse: 6 G6P → 5 G6P + 12 NADPH + 6 CO₂ (PDF s.106-107).' },
    { id: 'c27', topic: 'ppp', page: 's.101-105', tag: 'Non-Oksidatif Faz',
      q: 'Transketolaz ve Transaldolaz kaçar karbon aktarır? Hangisi Tiamin Pirofosfat (TPP/B1) bağımlıdır?',
      hint: 'Keto = 2C (B1 lazım), Aldol = 3C (B1 gerekmez).',
      a: 'Transketolaz: 2 karbon aktarır ve TPP (B1) bağımlıdır | Transaldolaz: 3 karbon aktarır (TPP gerektirmez).',
      why: 'PDF s.102 kuralı: 2C veya 3C birimini VEREN şeker daima KETOZ, ALAN şeker daima ALDOZDUR. Eritrosit Transketolaz aktivitesi B1 eksikliğinin tanı testidir.',
      trap: 'Hücrede sadece Riboz 5-P gerekirse (NADPH gerekmiyorsa) glikolizden F6P + GA3P tersine çalışıp oksidatif faza girmeden Riboz 5-P üretir!' },
    { id: 'c28', topic: 'ppp', page: 's.110-111', tag: 'Klinik — Favizm',
      q: 'G6PD eksikliğinde (Favizm) bakla, primakin veya enfeksiyon sonrası neden HEMOLİTİK KRİZ ve HEİNZ CİSİMCİKLERİ oluşur?',
      hint: 'Eritrositin tek NADPH kaynağı kesilince GSH’a ne olur?',
      a: 'NADPH yetersizliği → Glutatyon Redüktaz çalışamaz → İndirgenmiş GSH tükenir → H₂O₂ ve OH• temizlenemez → Hemoglobin denatüre olup çöker (Heinz cisimcikleri) + zar lipit peroksidasyonu → HEMOLİZ!',
      why: 'X’e bağlı kalıtılır (>200 milyon kişi). Çoğu hasta oksidan tetikleyici olmadan tamamen asemptomatiktir.',
      trap: 'Selenyum bağımlı Glutatyon Peroksidaz (GSH-Px) H₂O₂’yi suya çevirir; FAD ve NADPH bağımlı Glutatyon Redüktaz (GSH-R) GSSG’yi tekrar GSH yapar.' },
    { id: 'c29', topic: 'ppp', page: 's.112, 115, 121', tag: 'Serbest Radikaller',
      q: 'Fenton ve Haber-Weiss reaksiyonlarının ortak yıkıcı ürünü nedir ve hangi metal katalizler?',
      hint: 'H₂O₂ + Fe²⁺ → ?',
      a: 'Hidroksil radikali (OH•) — Demir (Fe²⁺ / Fe³⁺) kataliziyle oluşur!',
      why: 'Fenton: H₂O₂ + Fe²⁺ → OH• + OH⁻ + Fe³⁺. Haber-Weiss: H₂O₂ + O₂•⁻ → OH• + OH⁻ + O₂. OH• çok doymamış yağ asitlerine saldırıp lipit peroksidasyonunu başlatır.',
      trap: 'PDF s.116: H₂O₂, O₃, HOCl, Singlet O₂, LOOH ve ONOO⁻ radikal OLMAYAN reaktif bileşiklerdir (ortaklanmamış elektronları yoktur)!' },

    // --- 7. ÜRONİK ASİT, POLİOL, FRÜKTOZ, GALAKTOZ (s.126-128) ---
    { id: 'c30', topic: 'other', page: 's.126', tag: 'Üronik Asit Yolu',
      q: 'İnsanlar neden C vitamini (L-askorbik asit) sentezleyemez? Esansiyel pentozüride hangi enzim eksiktir?',
      hint: 'Üronik asit yolunun iki klasik enzim eksikliği.',
      a: 'C vitamini sentezlenemez çünkü L-Gulonolakton oksidaz eksiktir. Esansiyel pentozüride (benign) L-Ksilüloz redüktaz eksiktir.',
      why: 'Üronik asit yolunun insandaki ana ürünü UDP-Glikuronattır (bilirubin/ilaç glikuronidasyonu ve proteoglikan sentezi).',
      trap: 'Esansiyel pentozüri zararsızdır ama idrarda indirgeyici şeker (+) verip yanlışlıkla diyabet sanılabilir.' },
    { id: 'c31', topic: 'other', page: 's.127', tag: 'Poliol Yolu',
      q: 'Diyabette lens (katarakt) ve Schwann hücrelerinde (nöropati) ozmotik hasar yapan enzim ve molekül çifti nedir?',
      hint: 'Glikoz + NADPH → ? (Sorbitol DH bu dokularda azdır).',
      a: 'Aldoz Redüktaz → Sorbitol birikimi!',
      why: 'Lens, retina, periferik sinir ve böbrekte Sorbitol Dehidrojenaz çok azdır. Hiperglisemide Sorbitol birikip hücreyi şişirir ve NADPH tükettiği için oksidatif stresi artırır.',
      trap: 'Seminal vezikülde ise Sorbitol DH boldur; spermlere enerji kaynağı olarak Früktoz üretir!' },
    { id: 'c32', topic: 'other', page: 's.127', tag: 'Früktoz — Kritik Ayrım',
      q: 'Früktokinaz eksikliği ile Aldolaz B eksikliği arasındaki HAYATİ klinik fark nedir?',
      hint: 'Biri tamamen sessizdir (benign), diğeri ağır hipoglisemi yapar.',
      a: 'Früktokinaz eksikliği (Esansiyel früktözüri): Tamamen BENİGN | Aldolaz B eksikliği (Herediter Früktoz İntoleransı): F-1-P birikimi → Pi & ATP tükenmesi → AĞIR HİPOGLİSEMİ, kusma, sarılık, karaciğer yetmezliği!',
      why: 'HFI tipik olarak bebek 4–6. ayda meyve suyu/sükrozlu ek gıdaya geçince başlar. Ayrıca Früktoz karaciğerde PFK-1’i bypass ettiği için glikozdan çok daha hızlı metabolize olur.',
      trap: 'HFI hastasına früktoz, sükroz ve SORBİTOL (vücutta früktoza döner!) kesinlikle yasaktır.' },
    { id: 'c33', topic: 'other', page: 's.128', tag: 'Galaktozemi',
      q: 'Klasik Galaktozemide eksik enzim nedir ve HFI’den (Aldolaz B) nasıl ayırt edilir?',
      hint: 'Anne sütü + yenidoğan kataraktı.',
      a: 'Eksik enzim: GALT (Galaktoz 1-fosfat üridil transferaz). Doğumdan hemen sonra ANNE SÜTÜ (laktoz) ile başlar ve Galaktitol birikimine bağlı KATARAKT görülür (HFI’de katarakt yoktur, ek gıdada başlar).',
      why: 'Galaktokinaz eksikliğinde ise Galaktoz-1-P birikmez, sadece Galaktitol oluştuğu için tek bulgu yenidoğan kataraktıdır.',
      trap: 'Klasik galaktozemide anne sütü KESİLİR; E. coli sepsisi riski yüksektir.' },

    // --- 8. GLİKONEOJENEZ, CORİ & GLİKOZ-ALANİN (s.129-145) ---
    { id: 'c34', topic: 'gng', page: 's.129-136', tag: '4 Bypass & Maliyet',
      q: 'Glikoneojenezin 4 özel bypass enzimi, ana hız kısıtlayıcı enzimi ve 1 Glikoz için enerji maliyeti nedir?',
      hint: '2 Piruvat → 1 Glikoz.',
      a: '4 Bypass: Piruvat Karboksilaz (Biotin, mitokondri), PEPCK (GTP), Früktoz 1,6-bisfosfataz (ANA HIZ KISITLAYICI), Glikoz 6-fosfataz (ER). Maliyet: 4 ATP + 2 GTP (= 6~P) + 2 NADH.',
      why: 'Karaciğer (%90) ve böbrekte (%10) yapılır. Kas hücresinde Glikoz 6-fosfataz olmadığı için kas glikoneojenezle kana glikoz veremez.',
      trap: 'Biotin (B7) eksikliği (çiğ yumurta akı = avidin) Piruvat Karboksilazı bozar!' },
    { id: 'c35', topic: 'gng', page: 's.145', tag: 'Resiprokal Kontrol',
      q: 'Piruvat Karboksilazın ZORUNLU allosterik aktivatörü nedir? Früktoz 1,6-bisfosfatazı ne inhibe eder?',
      hint: 'Yağ yıkımı artınca biriken 2C molekül + PFK-1’in aktivatörü.',
      a: 'Piruvat Karboksilaz aktivatörü: Asetil-KoA (zorunlu!). Früktoz 1,6-bisfosfataz inhibitörleri: Früktoz 2,6-bisfosfat ve AMP (Sitrat ve ATP aktive eder).',
      why: 'Açlıkta yağ asidi oksidasyonundan artan Asetil-KoA bir yandan PDH’yi kapatır, bir yandan Piruvat Karboksilazı açarak Piruvatı Glikoneojeneze yönlendirir!',
      trap: 'Asetil-KoA glikoneojenezin SUBSTRATI değildir (karbon vermez), sadece AKTİVATÖRÜDÜR!' },
    { id: 'c36', topic: 'gng', page: 's.137-144', tag: 'Cori, Alanin & Gliserol',
      q: 'Cori Siklusu, Glikoz-Alanin Siklusu ve Gliserolün karaciğere taşıdığı substratlar nelerdir? Yağ dokusunda hangi enzim YOKTUR?',
      hint: 'Laktat, Alanin (NH₂ taşır), Gliserol.',
      a: 'Cori: Kas Laktatı (M₄-LDH) → KC (H₄-LDH, 6~P harcar). Glikoz-Alanin: Kas Alanini → KC (hem karbon hem NH₂/üreyi taşır). Yağ dokusunda GLİSEROKİNAZ yoktur; gliserol sadece karaciğerde glikoneojeneze girer.',
      why: 'Yağ dokusu trigliserit omurgası olan Gliserol 3-P’ı yalnızca glikolizdeki DHAP’tan sentezleyebilir (PDF s.139).',
      trap: 'Metformin karaciğer glikoneojenezini baskılayarak Tip 2 DM’de açlık kan şekerini düşürür.' },
    { id: 'c37', topic: 'gng', page: 's.205', tag: 'Klinik — Alkol Hipoglisemisi',
      q: 'Açlıkta aşırı alkol (etanol) tüketimi neden ağır HİPOGLİSEMİ ve LAKTİK ASİDOZ yapar?',
      hint: 'Alkol DH ve Aldehit DH hangi koenzimi aşırı üretir?',
      a: 'Etanol yıkımı karaciğerde NADH/NAD⁺ oranını patlatır → Piruvat Laktata, Oksalasetat Malata ve DHAP Gliserol-3-P’a kayar → Glikoneojenez kilitlenir!',
      why: 'Açlıkta karaciğer glikojeni de tükendiği için kan şekeri hızla düşer (ADA Düzey 2: <54 mg/dL).',
      trap: 'Tedavide IV Dekstroz verilmeden önce (veya birlikte) mutlaka Tiamin (B1) eklenir.' },

    // --- 9. GLİKOJEN METABOLİZMASI & GSD (s.146-164) ---
    { id: 'c38', topic: 'glg', page: 's.146-150', tag: 'Glikojenez',
      q: 'Glikojen sentezini başlatan öncül protein hangisidir ve Glikojen Sentaz kaçıncı glikozdan itibaren devralır?',
      hint: 'İlk 7 glikoz otokatalitik bağlanır.',
      a: 'Öncül protein: GLİKOJENİN (ilk 7 glikozu kendine bağlar). Glikojen Sentaz 8. glikozdan itibaren α-(1,4) bağlarıyla zinciri uzatır.',
      why: 'Glikoz 1-P + UTP → UDP-Glikoz (UDPG pirofosforilaz). Dallanma yapıcı enzim (Transglikozilaz) α-(1,6) dallarını oluşturur.',
      trap: 'Glikojen Sentaz: Defosforile (I) = AKTİF | Fosforile (D) = İNAKTİF (G6P, D formunu bile allosterik aktive eder!).' },
    { id: 'c39', topic: 'glg', page: 's.151-154', tag: 'Glikojenoliz',
      q: 'Glikojen Fosforilazın vitamin kofaktörü nedir? Dallanma Kırıcı Enzimin 2 aktivitesi sonucunda ne açığa çıkar?',
      hint: 'B6 vitamini + glikojenolizin %10’luk serbest ürünü.',
      a: 'Glikojen Fosforilaz kofaktörü: Piridoksal Fosfat (PLP — Vitamin B6). Dallanma kırıcı enzim (Glukan transferaz + Amilo-1,6-glikozidaz) α-(1,6) bağını suyla kırarak SERBEST GLİKOZ (%10) çıkarır!',
      why: 'Glikojenolizin ~%90’ı Glikoz 1-P (Fosforilaz ile, ATP tasarruflu), ~%10’u ise serbest glikozdur.',
      trap: 'Glikojen Fosforilaz: Fosforile (a) = AKTİF | Defosforile (b) = İNAKTİF (Kasta AMP, b formunu bile aktive eder!).' },
    { id: 'c40', topic: 'glg', page: 's.160-164', tag: '3 Hormonal Kaskad',
      q: 'Fosforilaz Kinazın (αβγδ)₄ alt birimlerinin görevi nedir? Kasta hormon olmadan glikojenolizi ne başlatır?',
      hint: 'δ alt birimi = Kalmodulin!',
      a: 'γ = Katalitik; α,β = PKA fosforilasyon bölgesi; δ = Kalmodulin (Ca²⁺ bağlar). Kas kasılmasında salınan Ca²⁺ doğrudan δ (Kalmodulin)’e bağlanıp hormon olmadan glikojenolizi başlatır!',
      why: '3 Kaskad (PDF s.162): (I) Adenilat siklaz/cAMP/PKA, (II) Sinir uyarısı/Ca²⁺, (III) Fosfoinozitol (IP₃/DAG/PKC). PKA ayrıca İnhibitör-1’i fosforilleyerek PP-1’i susturur. İnsülin Fosfodiesterazı ve PP-1’i aktive eder.',
      trap: 'Kasta GLUKAGON reseptörü YOKTUR! Glukagon sadece karaciğeri, Epinefrin hem karaciğeri hem kası uyarır.' },
    { id: 'c41', topic: 'glg', page: 's.155, 207', tag: 'GSD — Von Gierke vs McArdle',
      q: 'Von Gierke (GSD Tip I), Pompe (Tip II), Cori (Tip III) ve McArdle (Tip V) hastalıklarının eksik enzimleri ve ayırt edici bulguları nelerdir?',
      hint: 'Tip I = G6Paz, Tip II = Lizozom, Tip III = Dallanma kırıcı, Tip V = Kas fosforilazı.',
      a: 'Tip I (Von Gierke — G6Paz): Ağır açlık hipoglisemisi, laktik asidoz, hiperürisemi, hiperlipidemi, hepatomegali | Tip II (Pompe — Lizozomal α-1,4-glikozidaz): Kardiyomegali (hipoglisemi YOK!) | Tip III (Cori — Dallanma kırıcı): Hafif hipoglisemi, normal laktat | Tip V (McArdle — Kas fosforilazı): Egzersizde kramp, miyoglobinüri, laktat YÜKSELMEZ, kan şekeri normal!',
      why: 'Tip I’de hem glikojenoliz hem glikoneojenez kilitli olduğu için glukagon enjeksiyonuna kan şekeri yanıt vermez.',
      trap: 'Tip VI (Hers) = Karaciğer glikojen fosforilazı eksikliğidir (McArdle ile karıştırma!).' },

    // --- 10. HORMONLAR, DİYABET & HİPOGLİSEMİ (s.165-207 + ADA 2026) ---
    { id: 'c42', topic: 'dm', page: 's.167-169', tag: 'İnsülin Yapısı',
      q: 'İnsülinin yapısı nasıldır ve C-peptid ölçümü klinikte neyi ayırt etmede kullanılır?',
      hint: 'A + B zinciri; dışarıdan iğne ile endojen üretim farkı.',
      a: 'A zinciri (21 aa) + B zinciri (30 aa) disülfid bağlarıyla bağlıdır. C-peptid endojen insülinle 1:1 salınır: Ekzojen insülin uygulamasında C-peptid DÜŞÜK, insülinomada C-peptid YÜKSEKTİR.',
      why: 'İnsülin dizisi belirlenen ilk protein hormon, RIA ile ölçülen ilk madde ve rekombinant DNA ile üretilen ilk ilaçtır (PDF s.167).',
      trap: 'İnsülin kas ve yağ dokusuna GLUT-4 translokasyonuyla glikoz girişini artırır; beyin ve eritrosit insülinden bağımsızdır.' },
    { id: 'c43', topic: 'dm', page: 's.181-183', tag: 'Karşıt Hormonlar',
      q: 'Kan glikozunun AKUT kısa süreli ve UZUN SÜRELİ düzenlenmesini hangi insülin karşıtı hormonlar yapar? Kortizolün paradoksal etkisi nedir?',
      hint: 'PDF s.181-183 tablosu.',
      a: 'Akut kısa süreli: Glukagon (KC) & Epinefrin (KC+Kas) | Uzun süreli: Kortizol & Büyüme Hormonu. Kortizol glikoneojenezi ve kas proteolizini artırırken aynı zamanda karaciğer GLİKOJENEZİNİ de artırır!',
      why: 'Addison (kortizol eksikliği) ve hipopituitarizm erişkinlerde açlık hipoglisemisi nedenidir.',
      trap: 'Glukagon glikojenoliz(++), glikoneojenez(++), ketojenez ve lipolizi(++) artırır.' },
    { id: 'c44', topic: 'dm', page: 's.192-193 (ADA 2026)', tag: 'DM Tanı Kriterleri',

  function getCardSRS(id) {
    return state.srs[id] || { reps: 0, interval: 0, ef: 2.5, due: 0, lapses: 0, lastRating: null };
  }

  // Gerçek SM-2 algoritması (1=Tekrar, 2=Zor, 3=İyi, 4=Kolay)
  function applySM2(cardId, quality) {
    const now = Date.now();
    const d = { ...getCardSRS(cardId) };
    const DAY = 86400000;

    if (quality === 1) {
      d.reps = 0;
      d.interval = 0.0007; // ~1 dk
      d.lapses += 1;
      d.ef = Math.max(1.3, d.ef - 0.2);
      d.due = now + 60000;
    } else if (quality === 2) {
      d.reps = Math.max(1, d.reps);
      d.interval = d.interval < 0.5 ? 0.5 : Number((d.interval * 1.2).toFixed(2));
      d.ef = Math.max(1.3, d.ef - 0.15);
      d.due = now + d.interval * DAY;
    } else if (quality === 3) {
      if (d.reps === 0) d.interval = 1;
      else if (d.reps === 1) d.interval = 3;
      else d.interval = Number((d.interval * d.ef).toFixed(1));
      d.reps += 1;
      d.due = now + d.interval * DAY;
    } else {
      if (d.reps === 0) d.interval = 4;
      else d.interval = Number((Math.max(4, d.interval * d.ef * 1.3)).toFixed(1));
      d.reps += 1;
      d.ef = Math.min(3.0, d.ef + 0.15);
      d.due = now + d.interval * DAY;
    }
    d.lastRating = quality;
    state.srs[cardId] = d;

    state.totalReviews += 1;
    if (quality >= 3) state.correctReviews += 1;
    recordProgressPoint();
    saveLocal();
    return d;
  }

  function previewInterval(cardId, quality) {
    const d = getCardSRS(cardId);
    if (quality === 1) return '1 dk';
    if (quality === 2) return d.interval < 0.5 ? '12 sa' : `${Math.max(1, Math.round(d.interval * 1.2))} gün`;
    if (quality === 3) return d.reps === 0 ? '1 gün' : d.reps === 1 ? '3 gün' : `${Math.round(d.interval * d.ef)} gün`;
    return d.reps === 0 ? '4 gün' : `${Math.round(Math.max(4, d.interval * d.ef * 1.3))} gün`;
  }

  function recordProgressPoint() {
    const label = `Tur ${state.history.length + 1}`;
    const acc = state.totalReviews ? Math.round((state.correctReviews / state.totalReviews) * 100) : 0;
    const mastered = CARDS.filter(c => getCardSRS(c.id).reps >= 2).length;
    if (state.totalReviews % 3 === 1 || state.history.length === 0) {
      state.history.push({ label, reviewed: state.totalReviews, accuracy: acc, mastered });
      if (state.history.length > 20) state.history.shift();
    } else {
      const last = state.history[state.history.length - 1];
      last.reviewed = state.totalReviews;
      last.accuracy = acc;
      last.mastered = mastered;
    }
  }

  function generateMemoryCode() {
    const compactSrs = {};
    Object.entries(state.srs).forEach(([k, v]) => {
      compactSrs[k] = [v.reps, Number(v.interval.toFixed(2)), Number(v.ef.toFixed(2)), Math.round(v.due / 60000), v.lapses, v.lastRating];
    });
    const payload = {
      v: 1,
      s: compactSrs,
      r: [state.totalReviews, state.correctReviews, state.streakDays],
      h: state.history.slice(-12),
      e: state.examHistory.slice(-10)
    };
    const json = JSON.stringify(payload);
    const b64 = btoa(unescape(encodeURIComponent(json)));
    return `KHMEM-${b64}`;
  }

  function generateMemoryLink() {
    const code = generateMemoryCode();
    try {
      const base = window.location.href.split('#')[0];
      if (base.startsWith('http')) return `${base}#mem=${code}`;
    } catch (_) {}
    return `https://karbonhidrat-anki.local/#mem=${code}`;
  }

  function loadFromMemoryString(rawInput) {
    try {
      let str = (rawInput || '').trim();
      if (str.includes('#mem=')) str = str.split('#mem=')[1].trim();
      if (str.startsWith('KHMEM-')) str = str.slice(6);
      const json = decodeURIComponent(escape(atob(str)));
      const data = JSON.parse(json);
      if (!data || data.v !== 1) throw new Error('Geçersiz format');
      const restored = {};
      Object.entries(data.s || {}).forEach(([k, arr]) => {
        restored[k] = { reps: arr[0], interval: arr[1], ef: arr[2], due: arr[3] * 60000, lapses: arr[4], lastRating: arr[5] };
      });
      state.srs = restored;
      if (Array.isArray(data.r)) {
        state.totalReviews = data.r[0] || 0;
        state.correctReviews = data.r[1] || 0;
        state.streakDays = data.r[2] || 1;
      }
      if (Array.isArray(data.h)) state.history = data.h;
      if (Array.isArray(data.e)) state.examHistory = data.e;
      saveLocal();
      return true;
    } catch (_) {
      return false;
    }
  }

  function saveLocal() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        srs: state.srs,
        history: state.history,
        examHistory: state.examHistory,
        totalReviews: state.totalReviews,
        correctReviews: state.correctReviews,
        streakDays: state.streakDays,
        darkMode: state.darkMode
      }));
    } catch (_) {}
  }

  function loadLocal() {
    // 1. URL hash içinde #mem= varsa önce oradan yükle!
    try {
      if (window.location.hash && window.location.hash.includes('mem=')) {
        if (loadFromMemoryString(window.location.hash)) {
          showToast('Kişisel Hafıza Linkinden kaldığın yer yüklendi!', 'emerald');
          return;
        }
      }
    } catch (_) {}
    // 2. Yoksa localStorage
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const p = JSON.parse(raw);
        if (p.srs) state.srs = p.srs;
        if (p.history) state.history = p.history;
        if (p.examHistory) state.examHistory = p.examHistory;
        if (typeof p.totalReviews === 'number') state.totalReviews = p.totalReviews;
        if (typeof p.correctReviews === 'number') state.correctReviews = p.correctReviews;
        if (typeof p.streakDays === 'number') state.streakDays = p.streakDays;
        if (typeof p.darkMode === 'boolean') state.darkMode = p.darkMode;
      }
    } catch (_) {}
  }

  function applyTheme() {
    document.documentElement.classList.toggle('dark', state.darkMode);
    const btn = document.getElementById('theme-btn');
    if (btn) btn.textContent = state.darkMode ? '☀️' : '🌙';
  }

  function showToast(msg, tone = 'indigo') {
    const box = document.getElementById('toast-box');
    if (!box) return;
    const cls = {
      indigo: 'bg-indigo-600 text-white',
      emerald: 'bg-emerald-600 text-white',
      rose: 'bg-rose-600 text-white',
      amber: 'bg-amber-600 text-white'
    }[tone] || 'bg-indigo-600 text-white';
    const el = document.createElement('div');
    el.className = `px-3.5 py-2 rounded-xl shadow-lg text-xs font-bold fade-in ${cls}`;
    el.textContent = msg;
    box.appendChild(el);
    setTimeout(() => el.remove(), 2600);
  }

  function copyText(text, successMsg) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => showToast(successMsg, 'emerald')).catch(() => fallbackCopy(text, successMsg));
    } else {
      fallbackCopy(text, successMsg);
    }
  }
  function fallbackCopy(text, successMsg) {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showToast(successMsg, 'emerald'); } catch (_) {}
    ta.remove();
  }

  function exportAnkiTSV() {
    const rows = CARDS.map(c => {
      const topicName = TOPICS.find(t => t.id === c.topic)?.name || c.topic;
      const front = `[${topicName} • ${c.tag}] ${c.q}`.replace(/\t|\n/g, ' ');
      const back = `<b>${c.a}</b><br><br><i>Mekanizma:</i> ${c.why}<br><i>Sınav Tuzağı:</i> ${c.trap} (${c.page})`.replace(/\t|\n/g, ' ');
      return `${front}\t${back}\tkarbonhidrat_${c.topic}`;
    });
    const blob = new Blob([rows.join('\n')], { type: 'text/tab-separated-values;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'karbonhidrat_metabolizmasi_anki_destesi.tsv';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast('Anki .tsv dosyası indirildi! (Anki > İçe Aktar)', 'emerald');
  }

  // =========================================================================
  // 5. KUYRUK VE METRİK HESAPLAMALARI
  // =========================================================================
  function getTopicName(id) {
    return TOPICS.find(t => t.id === id)?.name || id;
  }

  function getAnkiQueue() {
    const now = Date.now();
    const pool = CARDS.filter(c => state.topicFilter === 'all' || c.topic === state.topicFilter);
    const due = pool.filter(c => {
      const s = getCardSRS(c.id);
      return s.reps > 0 && s.due <= now;
    }).sort((a, b) => getCardSRS(a.id).due - getCardSRS(b.id).due);

    const fresh = pool.filter(c => getCardSRS(c.id).reps === 0 && getCardSRS(c.id).lastRating === null);
    const learning = pool.filter(c => getCardSRS(c.id).reps === 0 && getCardSRS(c.id).lastRating === 1);
    const future = pool.filter(c => getCardSRS(c.id).reps > 0 && getCardSRS(c.id).due > now)
      .sort((a, b) => getCardSRS(a.id).due - getCardSRS(b.id).due);

    return { pool, due, fresh, learning, ordered: [...learning, ...due, ...fresh, ...future] };
  }

  function pickNextAnkiCard() {
    const q = getAnkiQueue();
    if (!q.ordered.length) { state.currentCardId = null; return null; }
    if (state.currentCardId && q.ordered.some(c => c.id === state.currentCardId)) {
      return q.ordered.find(c => c.id === state.currentCardId);
    }
    state.currentCardId = q.ordered[0].id;
    return q.ordered[0];
  }

  function computeMetrics() {
    const total = CARDS.length;
    const studied = CARDS.filter(c => getCardSRS(c.id).lastRating !== null).length;
    const mastered = CARDS.filter(c => getCardSRS(c.id).reps >= 2 || getCardSRS(c.id).interval >= 3).length;
    const weak = CARDS.filter(c => getCardSRS(c.id).lastRating === 1 || getCardSRS(c.id).lapses > 0).length;
    const now = Date.now();
    const dueNow = CARDS.filter(c => {
      const s = getCardSRS(c.id);
      return s.lastRating === null || s.due <= now;
    }).length;

    // Ortalama hafıza stabilitesi S (gün cinsinden): tekrarsız bazal S=1.2 gün, tekrarlı kartlarda interval'e göre artar
    let sumStability = 0;
    let counted = 0;
    CARDS.forEach(c => {
      const s = getCardSRS(c.id);
      if (s.lastRating !== null) {
        sumStability += Math.max(0.8, s.interval * 1.45 + s.reps * 1.2);
        counted += 1;
      }
    });
    const avgStability = counted > 0 ? Number((sumStability / counted).toFixed(2)) : 1.5;
    const retention7d = Math.round(Math.exp(-7 / avgStability) * 100);
    const accuracy = state.totalReviews ? Math.round((state.correctReviews / state.totalReviews) * 100) : 0;

    // Konu bazlı hakimiyet
    const topicStats = TOPICS.map(t => {
      const tc = CARDS.filter(c => c.topic === t.id);
      const tStudied = tc.filter(c => getCardSRS(c.id).lastRating !== null).length;
      const tMastered = tc.filter(c => getCardSRS(c.id).reps >= 2 || getCardSRS(c.id).lastRating === 4).length;
      const pct = tc.length ? Math.round(((tMastered + (tStudied - tMastered) * 0.4) / tc.length) * 100) : 0;
      return { ...t, total: tc.length, studied: tStudied, mastered: tMastered, pct };
    });

    const examAvg = state.examHistory.length
      ? Math.round(state.examHistory.reduce((a, b) => a + b.pct, 0) / state.examHistory.length)
      : null;

    return { total, studied, mastered, weak, dueNow, avgStability, retention7d, accuracy, topicStats, examAvg };
  }

        return s.lastRating === 1 || s.lastRating === 2 || s.lapses > 0;
      });
      return w.length ? w : CARDS;
    }
    return CARDS.filter(c => c.topic === state.turboFilter);
  }

          correct += 1;
          byTopic[q.topic].ok += 1;
        }
      });
      const pct = qs.length ? Math.round((correct / qs.length) * 100) : 0;
      const level = pct >= 85 ? '🏆 İleri Düzey (Sınava Hazır)' : pct >= 65 ? '📈 Orta-İyi (Eksikleri Kapat)' : '🔁 Temel Düzey (Anki Tekrarı Şart)';

      return `

              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // Aktif sınav ekranı
    const q = state.examQuestions[state.examIndex];
    const chosen = state.examAnswers[q.id];
    const answeredCount = Object.keys(state.examAnswers).length;

    return `
      <div class="max-w-3xl mx-auto space-y-4 fade-in">
        <div class="p-3.5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 flex items-center justify-between text-xs">

          <div class="space-y-2.5">

                  class="w-full text-left p-3.5 rounded-xl border text-xs sm:text-sm font-semibold transition flex items-center gap-3 ${

          </div>

          <div class="flex items-center justify-between pt-3 border-t border-slate-100 dark:border-slate-800">
            <button data-action="exam-prev" class="px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-bold" ${state.examIndex === 0 ? 'disabled' : ''}>◀ Önceki</button>
            ${state.examIndex < state.examQuestions.length - 1 ? `
              <button data-action="exam-next" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold">Sonraki ▶</button>
            ` : `
              <button data-action="finish-exam" class="px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold shadow-sm">✓ Sınavı Bitir &amp; Karneyi Gör</button>
            `}
          </div>
        </div>
      </div>
    `;

  // =========================================================================
  // 7. CHART.JS GRAFİKLERİ (UNUTMA, GELİŞİM & KONU HAKİMİYETİ)
  // =========================================================================
  let _charts = [];
  function mountStatsCharts() {
    _charts.forEach(c => { try { c.destroy(); } catch (_) {} });
    _charts = [];
    if (typeof Chart === 'undefined' || state.activeTab !== 'stats') return;

    const m = computeMetrics();
    const isDark = state.darkMode;
    const grid = isDark ? 'rgba(148,163,184,0.15)' : 'rgba(148,163,184,0.25)';
    const txt = isDark ? '#cbd5e1' : '#334155';

    // 1. Ebbinghaus Unutma Eğrisi
    const c1 = document.getElementById('chart-forgetting');
    if (c1) {
      const days = [0, 1, 2, 3, 5, 7, 10, 14, 21, 30];
      const rawCurve = days.map(d => Math.round(Math.exp(-d / 1.5) * 100));
      const userCurve = days.map(d => Math.round(Math.exp(-d / Math.max(1.5, m.avgStability)) * 100));
      _charts.push(new Chart(c1, {
        type: 'line',
        data: {
          labels: days.map(d => `${d}. gün`),
          datasets: [
            { label: 'Tekrarsız Ham Unutma (S=1.5g)', data: rawCurve, borderColor: '#e11d48', borderDash: [5, 4], tension: 0.35, borderWidth: 2, pointRadius: 2 },
            { label: `Senin SM-2 Hafıza Eğrin (S=${m.avgStability}g)`, data: userCurve, borderColor: '#059669', backgroundColor: 'rgba(5,150,105,0.12)', fill: true, tension: 0.35, borderWidth: 3, pointRadius: 3 }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { labels: { color: txt, font: { size: 11, weight: '600' } } } },
          scales: {
            x: { ticks: { color: txt, font: { size: 10 } }, grid: { color: grid } },
            y: { min: 0, max: 105, title: { display: true, text: 'Hatırlama Olasılığı (%)', color: txt, font: { size: 10 } }, ticks: { color: txt }, grid: { color: grid } }
          }
        }
      }));
    }

    // 2. Gelişim Eğrisi
    const c2 = document.getElementById('chart-growth');
    if (c2) {
      const hist = state.history.length ? state.history : [{ label: 'Başlangıç', accuracy: 0, mastered: 0 }];
      _charts.push(new Chart(c2, {
        type: 'line',
        data: {
          labels: hist.map(h => h.label),
          datasets: [
            { label: 'Hatırlama Doğruluğu (%)', data: hist.map(h => h.accuracy), borderColor: '#4f46e5', backgroundColor: 'rgba(79,70,229,0.12)', fill: true, tension: 0.35, borderWidth: 2.5 },
            { label: 'Ustalaşılan Kart Sayısı', data: hist.map(h => h.mastered), borderColor: '#f59e0b', tension: 0.35, borderWidth: 2.5 }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { labels: { color: txt, font: { size: 11, weight: '600' } } } },
          scales: {
            x: { ticks: { color: txt, font: { size: 10 } }, grid: { color: grid } },
            y: { min: 0, max: 105, ticks: { color: txt }, grid: { color: grid } }
          }
        }
      }));
    }

    // 3. Konu Bazlı Hakimiyet
    const c3 = document.getElementById('chart-topics');
    if (c3) {
      _charts.push(new Chart(c3, {
        type: 'bar',
        data: {
          labels: m.topicStats.map(t => t.short),
          datasets: [{
            label: 'Konu Hakimiyeti (%)',
            data: m.topicStats.map(t => t.pct),
            backgroundColor: m.topicStats.map(t => t.pct >= 75 ? '#10b981' : t.pct >= 40 ? '#6366f1' : '#f43f5e'),
            borderRadius: 8
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: txt, font: { size: 10, weight: '600' } }, grid: { display: false } },
            y: { min: 0, max: 100, title: { display: true, text: 'Hakimiyet (%)', color: txt, font: { size: 10 } }, ticks: { color: txt }, grid: { color: grid } }
          }
        }
      }));
    }
  }

  function updateNavUI() {
    ['anki', 'turbo', 'exam', 'stats'].forEach(t => {
      const b = document.getElementById(`nav-${t}`);
      if (!b) return;
      b.className = state.activeTab === t
        ? 'px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-bold transition whitespace-nowrap bg-white dark:bg-slate-900 text-indigo-600 dark:text-indigo-400 shadow-sm'
        : 'px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-bold transition whitespace-nowrap text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white';
    });
  }

  function render() {
    updateNavUI();
    const main = document.getElementById('main-content');
    if (!main) return;
    if (state.activeTab === 'anki') main.innerHTML = renderAnki();
    else if (state.activeTab === 'turbo') main.innerHTML = renderTurbo();
    else if (state.activeTab === 'exam') main.innerHTML = renderExam();
    else main.innerHTML = renderStats();
    renderSyncModal();
    mountStatsCharts();
  }

  // =========================================================================
  // 8. OLAY YÖNETİMİ & KLAVYE KISAYOLLARI
  // =========================================================================
  function findAction(node) {
    let cur = node;
    while (cur && cur !== document) {
      if (cur.getAttribute && cur.getAttribute('data-stop-prop') === 'true') return null;
      if (cur.getAttribute && cur.getAttribute('data-action')) return cur;
      cur = cur.parentNode;
    }
    return null;
  }

  document.addEventListener('click', (e) => {
    const btn = findAction(e.target);
    if (!btn) return;
    const action = btn.getAttribute('data-action');

    if (action === 'set-tab') {
      state.activeTab = btn.getAttribute('data-tab');
      render();
    } else if (action === 'toggle-theme') {
      state.darkMode = !state.darkMode;
      applyTheme();
      saveLocal();
      render();
    } else if (action === 'open-sync') {
      state.syncModalOpen = true;
      renderSyncModal();
    } else if (action === 'close-sync') {
      state.syncModalOpen = false;
      renderSyncModal();
    } else if (action === 'copy-mem-link') {
      copyText(generateMemoryLink(), 'Kişisel Hafıza Linki kopyalandı!');
    } else if (action === 'copy-mem-code') {
      copyText(generateMemoryCode(), 'Kişisel Hafıza Kodu kopyalandı!');
    } else if (action === 'import-mem-link') {
      const inp = document.getElementById('mem-link-in');
      if (inp && loadFromMemoryString(inp.value)) {
        state.syncModalOpen = false;
        state.currentCardId = null;
        showToast('Harika! Kaldığın yerden tüm ilerlemen yüklendi.', 'emerald');
        render();
      } else {
        showToast('Geçersiz hafıza linki veya kodu!', 'rose');
      }
    } else if (action === 'export-tsv') {
      exportAnkiTSV();
    } else if (action === 'show-hint') {
      state.showHint = true;
      render();
    } else if (action === 'flip-anki') {
      state.flipped = true;
      render();
    } else if (action === 'rate-anki') {
      const q = Number(btn.getAttribute('data-q'));
      if (state.currentCardId) {
        applySM2(state.currentCardId, q);
        state.currentCardId = null;
        state.flipped = false;
        state.showHint = false;
        render();
      }
    } else if (action === 'turbo-filter') {
      state.turboFilter = btn.getAttribute('data-val');
      state.turboIndex = 0;
      state.turboRevealed = false;
      render();
    } else if (action === 'turbo-flip') {
      state.turboRevealed = !state.turboRevealed;
      render();
    } else if (action === 'turbo-mark') {
      const ok = btn.getAttribute('data-ok') === '1';
      const pool = getTurboPool();
      const card = pool[state.turboIndex % pool.length];
      if (card) applySM2(card.id, ok ? 3 : 1);
      state.turboSessionCount += 1;
      state.turboIndex += 1;
      state.turboRevealed = false;
      render();
    } else if (action === 'exam-size') {
      state.examSize = Number(btn.getAttribute('data-val'));
      render();
    } else if (action === 'start-exam') {
      let pool = EXAM_BANK.filter(q => state.examTopic === 'all' || q.topic === state.examTopic);
      // Shuffle
      pool = [...pool].sort(() => Math.random() - 0.5).slice(0, Math.min(state.examSize, pool.length));
      state.examQuestions = pool;
      state.examAnswers = {};
      state.examIndex = 0;
      state.examActive = true;
      state.examFinished = false;
      state.examStartTime = Date.now();
      render();
    } else if (action === 'exam-pick') {
      const qid = btn.getAttribute('data-qid');
      const idx = Number(btn.getAttribute('data-idx'));
      state.examAnswers[qid] = idx;
      render();
    } else if (action === 'exam-prev') {
      if (state.examIndex > 0) state.examIndex -= 1;
      render();
    } else if (action === 'exam-next') {
      if (state.examIndex < state.examQuestions.length - 1) state.examIndex += 1;
      render();
    } else if (action === 'finish-exam') {
      state.examActive = false;
      state.examFinished = true;
      state.examElapsedSec = Math.max(1, Math.round((Date.now() - state.examStartTime) / 1000));
      let score = 0;
      state.examQuestions.forEach(q => { if (state.examAnswers[q.id] === q.ans) score += 1; });
      const pct = Math.round((score / state.examQuestions.length) * 100);
      state.examHistory.push({
        date: new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }),
        score,
        total: state.examQuestions.length,
        pct
      });
      saveLocal();
      showToast(`Sınav tamamlandı: %${pct} başarı!`, pct >= 70 ? 'emerald' : 'amber');
      render();
    } else if (action === 'reset-exam') {
      state.examActive = false;
      state.examFinished = false;
      render();
    } else if (action === 'jump-topic-anki') {
      state.activeTab = 'anki';
      state.topicFilter = btn.getAttribute('data-topic');
      state.currentCardId = null;
      state.flipped = false;
      state.showHint = false;
      render();
    }
  });

  document.addEventListener('change', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const act = el.getAttribute('data-action');
    if (act === 'anki-topic-filter') {
      state.topicFilter = el.value;
      state.currentCardId = null;
      state.flipped = false;
      state.showHint = false;
      render();
    } else if (act === 'turbo-topic-select') {
      state.turboFilter = el.value;
      state.turboIndex = 0;
      state.turboRevealed = false;
      render();
    } else if (act === 'exam-topic') {
      state.examTopic = el.value;
      render();
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
    if (state.syncModalOpen && e.key === 'Escape') {
      state.syncModalOpen = false;
      renderSyncModal();
      return;
    }
    if (state.activeTab === 'anki') {
      if (e.key === ' ' && !state.flipped) {
        e.preventDefault();
        state.flipped = true;
        render();
      } else if ((e.key === 'h' || e.key === 'H') && !state.flipped) {
        state.showHint = true;
        render();
      } else if (state.flipped && ['1', '2', '3', '4'].includes(e.key) && state.currentCardId) {
        applySM2(state.currentCardId, Number(e.key));
        state.currentCardId = null;
        state.flipped = false;
        state.showHint = false;
        render();
      }
    }
  });

  loadLocal();
  applyTheme();
  render();
})();
</script>
</body>
</html>
